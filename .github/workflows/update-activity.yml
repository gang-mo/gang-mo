name: Update GitHub activity card

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate activity card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: gang-mo
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from datetime import date, datetime, timedelta, timezone
          from pathlib import Path

          query = """
          query($login: String!, $from: DateTime!, $to: DateTime!) {
            user(login: $login) {
              contributionsCollection(from: $from, to: $to) {
                contributionCalendar {
                  totalContributions
                  weeks { contributionDays { date contributionCount } }
                }
              }
            }
          }
          """
          now = datetime.now(timezone.utc)
          variables = {
              "login": os.environ["PROFILE_USER"],
              "from": (now - timedelta(days=365)).isoformat(),
              "to": now.isoformat(),
          }
          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=json.dumps({"query": query, "variables": variables}).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Content-Type": "application/json",
                  "User-Agent": "gang-mo-profile-activity",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          if payload.get("errors"):
              raise RuntimeError(payload["errors"])

          calendar = payload["data"]["user"]["contributionsCollection"]["contributionCalendar"]
          days = {
              date.fromisoformat(item["date"]): item["contributionCount"]
              for week in calendar["weeks"] for item in week["contributionDays"]
          }
          longest = running = 0
          for day in sorted(days):
              running = running + 1 if days[day] > 0 else 0
              longest = max(longest, running)
          today = now.date()
          cursor = today if days.get(today, 0) else today - timedelta(days=1)
          current = 0
          while days.get(cursor, 0) > 0:
              current += 1
              cursor -= timedelta(days=1)

          total = calendar["totalContributions"]
          active = sum(count > 0 for count in days.values())
          updated = now.strftime("%Y-%m-%d %H:%M UTC")
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="760" height="190" viewBox="0 0 760 190" role="img" aria-label="GitHub activity">
          <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient></defs>
          <rect width="760" height="190" rx="14" fill="url(#bg)" stroke="#30363d"/>
          <text x="32" y="38" fill="#f0f6fc" font-family="Arial,sans-serif" font-size="19" font-weight="700">GitHub Activity</text>
          <text x="728" y="36" fill="#8b949e" font-family="Arial,sans-serif" font-size="11" text-anchor="end">Updated {updated}</text>
          <line x1="28" y1="56" x2="732" y2="56" stroke="#30363d"/>
          <g font-family="Arial,sans-serif" text-anchor="middle">
          <text x="127" y="105" fill="#58a6ff" font-size="31" font-weight="700">{total}</text><text x="127" y="132" fill="#8b949e" font-size="13">Contributions</text>
          <text x="316" y="105" fill="#3fb950" font-size="31" font-weight="700">{current}</text><text x="316" y="132" fill="#8b949e" font-size="13">Current Streak</text>
          <text x="505" y="105" fill="#d2a8ff" font-size="31" font-weight="700">{longest}</text><text x="505" y="132" fill="#8b949e" font-size="13">Longest Streak</text>
          <text x="662" y="105" fill="#f2cc60" font-size="31" font-weight="700">{active}</text><text x="662" y="132" fill="#8b949e" font-size="13">Active Days</text>
          </g><text x="380" y="169" fill="#6e7681" font-family="Arial,sans-serif" font-size="11" text-anchor="middle">Generated automatically from GitHub contributions</text></svg>'''
          output = Path("assets/github-activity.svg")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(svg, encoding="utf-8")
          PY

      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-activity.svg
          git diff --cached --quiet || git commit -m "chore: update GitHub activity card"
          git push
